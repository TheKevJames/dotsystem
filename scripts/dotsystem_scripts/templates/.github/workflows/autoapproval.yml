name: autoapproval

on:
  # The job runs none of the pull request's code: it only approves Renovate's
  # own pull requests, and needs the base repository's token to do so.
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  autoapproval:
    # Only PRs which have been created (pull_request.user) and pushed
    # (sender.login) by Renovate should be autoapproved, which will let
    # Renovate automerge them. Everything else needs a human review.
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]'
      && github.event.sender.login == 'renovate[bot]'
      && contains(github.event.pull_request.body, '**Automerge**: Enabled')
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr review "$PR_URL" --approve
