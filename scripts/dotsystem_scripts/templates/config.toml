deleted = [
    ".github/autoapproval.yml",
    ".github/workflows/dependencies.yaml",
    ".github/workflows/dependencies.yml",
    ".github/workflows/rulesets.yml",
]

seeded = [
    ".github/actions-policy.json",
    ".github/rulesets/required-checks.json",
]

[templated.".github/settings.yml"]
"repository.name" = { derive = "dirname", prompt = "Repository name" }
"repository.description" = { prompt = "Repository description" }
"repository.topics" = { prompt = "Topics" }
"repository.default_branch" = { derive = "git-branch", prompt = "Default branch" }

[features.docker]
placement = "root"

# A feature with placement "any" installs into a subdir or at the repo root. At
# the root, its fragment's repo blocks replace the root config's copies of its
# `exclude_hooks` instead of being copied alongside it. Both can be installed at
# once: subdirs stay excluded from the `exclude_hooks` only, so the fragment's
# other root hooks (eg. ty, uv-*) also run over them.
[features.python]
placement = "any"
exclude_hooks = ["flake8", "pylint", "ruff-check", "ruff-format"]

[features.python.merge]
"pyproject.toml" = ["tool.ty.rules", "dependency-groups.dev"]

# Detected by its files, as it has no pre-commit fragment.
[features.release]
placement = "root"

[features.shell]
placement = "root"

[features.terraform]
placement = "root"
