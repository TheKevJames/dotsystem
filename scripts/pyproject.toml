[project]
name = "dotsystem-scripts"
version = "0.1.0"
description = "personal scripts, exposed as commands"
requires-python = ">=3.11"
dependencies = [
    "ruamel.yaml==0.19.1",
    "tomlkit==0.15.1",
    "typer==0.27.2",
]

[project.scripts]
bakery = "dotsystem_scripts.bakery:main"
quickfix-pre-commit = "dotsystem_scripts.quickfix_pre_commit:main"
repo-template = "dotsystem_scripts.repo_template:app"

[dependency-groups]
dev = [
    "flake8-broken-line==1.0.0",
    "flake8-complicated-walrus==2.1.0",
    "flake8-import-restrictions==2.1",
    "flake8-requirements==2.3.0",
    "flake8==7.3.0",
    "hatchling==1.32.0",
    "pylint==4.0.8",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["dotsystem_scripts"]
exclude = ["dotsystem_scripts/bash"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.shared-scripts]
"build/git-wips" = "git-wips"
"build/retry" = "retry"
"build/tmpenv" = "tmpenv"
"build/todo" = "todo"

[tool.ty.rules]
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
