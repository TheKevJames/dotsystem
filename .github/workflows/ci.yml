name: ci

on: [pull_request, push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: '3.14'
      - uses: ./.github/actions/install-argbash
      - run: uv sync --group dev
        working-directory: scripts
      - uses: j178/prek-action@v3.0.0
        with:
          # renovate: datasource=pypi depName=prek
          prek-version: 0.5.2
          extra-args: --all-files

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: '3.14'
      - uses: ./.github/actions/install-argbash
      - run: uv sync --group dev
        working-directory: scripts
      - run: uv run pytest
        working-directory: scripts
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}/root/~/.config
